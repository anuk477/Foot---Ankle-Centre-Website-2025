name: Rebuild Sanity blog pages

on:
  repository_dispatch:
    types: [sanity-post-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.BLOG_DEPLOY_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build published Sanity posts
        run: |
          npm ci
          npm run build

      - name: Commit generated pages to main
        shell: bash
        run: |
          set -euo pipefail

          git add -- index.html blog/index.html sitemap.xml
          git add -u -- blog

          for marker in blog/*/.generated-blog-post; do
            [ -f "$marker" ] || continue
            post_dir="${marker%/.generated-blog-post}"
            git add -- "$marker" "$post_dir/index.html"
          done

          if git diff --cached --quiet; then
            echo "Sanity content produced no file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild published Sanity blog pages"
          git push origin HEAD:main
