name: Rebuild and deploy Sanity blog

on:
  repository_dispatch:
    types: [sanity-post-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-blog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Git push token
        env:
          BLOG_DEPLOY_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
        shell: bash
        run: |
          : "${BLOG_DEPLOY_TOKEN:?Add a fine-grained BLOG_DEPLOY_TOKEN secret with Contents: Read and write for this repository}"

      - name: Check out the website
        uses: actions/checkout@v6
        with:
          # A PAT is needed so the resulting push can start IONOS Deploy Now's
          # own GitHub Actions workflow.
          token: ${{ secrets.BLOG_DEPLOY_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build published Sanity posts
        run: npm run build

      - name: Commit generated blog pages for Deploy Now
        env:
          BLOG_DEPLOY_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          : "${BLOG_DEPLOY_TOKEN:?Add a fine-grained BLOG_DEPLOY_TOKEN secret with Contents: Read and write for this repository}"
          : "${TARGET_BRANCH:?Could not determine the branch to update}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The generator owns the blog output, its marker files, and the sitemap.
          # Stage deletions too so unpublished posts are removed from the next deploy.
          git add -- index.html sitemap.xml blog

          if git diff --cached --quiet; then
            echo "Generated blog output is already current; no commit is needed."
            exit 0
          fi

          git commit -m "chore: rebuild published Sanity blog"
          git push origin "HEAD:${TARGET_BRANCH}"
